[package]
name = "footplate"
version = "0.2.0"
edition = "2024"
description = "A native window onto a yardr yard: talk with the crew, and with the crew a linked yard exposes"
publish = false

[dependencies]
# gpui as released on crates.io, not a git revision of Zed: 0.2.2 is the
# newest release there (8 Oct 2026). Pinned exactly, since gpui changes its
# API between patch releases. runtime_shaders has the Metal shaders compiled
# when the window opens and not by the build, which then needs no Metal
# toolchain of Xcode (a download of its own since Xcode 26); it changes
# nothing on Linux.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# An image goes to the yard in base64, in the JSON of the call. In gpui's
# tree already.
base64 = "0.22"
# The stream's thread hands its events to gpui's foreground through this.
async-channel = "2"
# A mail's time in the zone of the person reading.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Where a character ends, for the line that is typed in.
unicode-segmentation = "1"
# A yard that is not on this machine is reached over TLS, trusted by the
# system's roots; socket2 sets the keepalive std has no call for. All three
# are in gpui's tree already, rustls with ring as it is built there.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
socket2 = "0.6"
# yardr's release is fetched and proved here (fetch.rs). The signature over
# its checksums is minisign's, verified in this process by the crate
# minisign's author keeps for exactly that: MIT, with no dependency of its
# own, so it is the one crate this adds to the tree. sha2 and flate2 are in
# gpui's tree already: the archive's checksum, and its gzip. The tar inside
# is read by fetch.rs itself, which takes four names and nothing else.
minisign-verify = "0.3"
sha2 = "0.10"
flate2 = "1"

# gpui's window options have no icon: on macOS the dock's is set on the
# application, with the bindings gpui itself is built on. So is the number
# on it (dock.rs), which gpui has no call for either, and the item in the
# menu bar with its menu (tray.rs): more features of the same crates, and
# no crate more.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSDockTile", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSError", "NSGeometry", "NSString"] }
# A notification of the system's (notify.rs) goes through the user
# notifications framework, whose answers come to blocks. block2 is in
# gpui's tree already; the framework's bindings are the one crate footplate
# adds, of the same family as those above.
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# On Linux the icon is also a property of the X11 window, set on a
# connection of our own: gpui hands out no handle to its X11 window. Both
# crates are in gpui's tree already; image scales the icon to a panel's sizes.
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = "0.13"
# Not used by footplate: this holds libc back for gpui's tree. gpui 0.2.2
# unpacks archives with zed-async-tar, whose xattr 0.2 wants libc::ENOATTR,
# and libc 0.2.190 no longer has it on Linux: the Linux build fails there
# ("cannot find value `ENOATTR` in crate `libc`"), and the gate, on a Mac,
# does not see it. Drop this when a libc has it again or gpui's tree no
# longer asks.
libc = ">=0.2.170, <0.2.190"
# The item in a desktop's tray (tray.rs) is a StatusNotifierItem, spoken
# over D-Bus by ksni, in Rust alone: no library of the system's is built
# against. It speaks through zbus, which is in gpui's tree already, and
# with async-io as gpui's has it: ksni's usual tokio would turn the one
# zbus of the tree to tokio under gpui too. blocking has it run on a thread
# of its own.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
# The window's own test opens it on gpui's test platform, without a screen.
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"
# The tests of fetch.rs sign a release of their own with a key they make,
# which minisign-verify cannot: it only verifies. By the same author, MIT;
# with it come scrypt and rpassword, for the passwords of keys, which the
# tests do not use. Nothing of it is in the built footplate.
minisign = "0.10"
# Two tests of refusals a file's mode carries tell root, which no mode
# holds, by its effective uid. Nothing of it is in the built footplate.
libc = ">=0.2.170, <0.2.190"
